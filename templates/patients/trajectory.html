{% extends "base.html" %}
{% block title %}Trayectoria — {{ hc }}{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/patients.css') }}">
{% endblock %}
{% block content %}
<h2>Trayectoria ventilatoria — {{ hc }}</h2>
<div class="trayectoria-card">
    <div id="trayectoria-empty" style="display:none">Sin datos de trayectoria.</div>
    <div id="trayectoria-chart"></div>
    <div id="trayectoria-tooltip" class="trayectoria-tooltip" style="display:none"></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
window.trajectoryData = {{ trayectoria_data | tojson }};
</script>
<script src="{{ url_for('static', filename='js/trajectory.js') }}"></script>
{% endblock %}
